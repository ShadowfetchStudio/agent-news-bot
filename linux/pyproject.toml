[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-news-bot"
version = "1.2.0"
description = "Local-first fresh news desk over localhost HTTP for AI agents"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "feedparser>=6.0.14,<7",
    "requests>=2.34.2,<3",
    "idna>=3.20,<4",
    "quickjs==1.19.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
agent-newsbot = "agent_newsbot.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_newsbot*"]

[tool.setuptools.package-data]
agent_newsbot = ["vendor/*", "resources/*"]

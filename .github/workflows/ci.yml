name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux-python:
    name: Linux Python Tests & Syntax
    runs-on: ubuntu-latest
    env:
      AGENT_NEWSBOT_HOME: ${{ runner.temp }}/agent-newsbot-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package & test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r linux/requirements.txt
          pip install pytest
      - name: Validate shell scripts
        run: bash -n linux/install.sh
      - name: Run pytest suite (including Swift/Python feed parity)
        run: pytest -v tests/

  macos-apple-silicon:
    name: macOS Apple Silicon Build
    runs-on: macos-latest
    env:
      AGENT_NEWSBOT_HOME: ${{ runner.temp }}/agent-newsbot-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Python and Swift integration contracts
        run: |
          python -m pip install -r linux/requirements.txt
          python -m pip install pytest
          pytest -v tests/
      - name: Validate build.sh syntax
        run: bash -n build.sh
      - name: Build Apple Silicon app bundle
        run: ./build.sh --arch arm64
      - name: Verify architecture & code signature
        run: |
          file "build/Agent News Bot.app/Contents/MacOS/AgentNewsBot" | grep -q "arm64"
          codesign --verify --deep --strict "build/Agent News Bot.app"

  dependency-audit:
    name: Locked dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit locked Python runtime dependencies
        run: pip-audit -r linux/requirements.lock --require-hashes --strict --progress-spinner off -f json -o python-audit.json
      - name: Audit JavaScript build dependencies
        working-directory: tools/twitter-text
        run: npm audit --audit-level=low
